name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install yamllint
      - run: yamllint --strict .

  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # covers standalone .js/.css/.json only — index.html's inline
      # <style>/<script> are not parsed by biome, see rail-check below
      - run: npx --yes @biomejs/biome ci .

  rails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-rails.sh

  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          if [ -f index.html ]; then
            npx --yes html-validate index.html
          else
            echo "no index.html yet — nothing to validate"
          fi
